<!DOCTYPE html>

<html>

	<head>
	
		<title> Student Database V4 </title>
		
		<link rel="stylesheet" href="style.css">
		
		<script src="script.js" defer></script>
		<!--
		-->
	
	</head>
	
	<body>
	
		<h1> Student Database V4 </h1>
		
		<div>
	
			<h2> Student Management </h2>
			
			<form>
			
				<label for="firstName"> First Name </label>
				<br>
				
				<input id="firstName" type="text" placeholder="Enter First Name" required>
				<br>
				<br>
				
				<label for="lastName"> Last Name </label>
				<br>
				
				<input id="lastName" type="text" placeholder="Enter Last Name" required>
				<br>
				<br>
				
				<label for="studentID"> Student ID </label>
				<br>
				
				<input id="studentIDsm" type="number" placeholder="Enter ID Number"  min="10000" max="99999" required>
				<p id="studentMessage">  </p>
				<br>
			
				<button type="button" id="addStudentButton" class="student-button"> Add Student </button>
			
				<button type="button" id="renameStudentButton" class="student-button"> Rename Student </button>
				
				<button type="button" id="removeStudentButton" class="student-button"> Remove Student </button>
			
			</form>
			
			<!--
			<br>
			<br>
			<br>
			-->
			
		</div>
	
		<div>
	
			<h2> Course Management </h2>
			
			<form>
			
				<label for="studentID"> Student ID </label>
				<br>
				
				<input id="studentIDcm" type="number" placeholder="Enter Student ID" min="10000" max="99999" required>
				<br>
				<br>
				
				<label for="courseName"> Course Name </label>
				<br>
				
				<input id="courseName" type="text" placeholder="Enter Course" required>
				<br>
				<br>
				
				<label for="courseGrade"> Course Grade </label>
				<br>
				
				<input id="courseGrade" type="number" placeholder="Enter Student ID" min="0" max="100" step="0.01" required>
				<p id="courseMessage">  </p>
				<br>
				
				<button type="button" id="addCourseButton" class="course-button"> Add Course </button>
				
				<button type="button" id="updateGradeButton" class="course-button"> Update Grade </button>
				
				<button type="button" id="removeCourseButton" class="course-button"> Remove Course </button>
			
			</form>
			
			<!--
			<br>
			<br>
			<br>
			-->
			
		</div>
		
		<div>
	
			<h2> View Records </h2>
			
			<button id="allStudentsButton" class="records-button"> Show All Students </button>
			
			<button id="oneStudentButton"class="records-button"> Show One Student </button>
			
			<button id="sortStudentsButton" class="records-button"> Sort Students </button>
			
			<table id="studentTable">
			
				<tr>
				
					<th id="idHeader"> Student ID </th>
					<th id="firstHeader"> First Name </th>
					<th id="lastHeader"> Last Name </th>
					<th id="avgHeader"> Average </th>
				
				</tr>
				
				<!--
				<tr>
				
					<td> 10000 </td>
					<td> Jamon </td>
					<td> Smith </td>
					<td> 99.20 </td>
				
				</tr>
				-->
			
			</table>
			
			<p id="studentCount">  </p> 
			
			<!--
			<br>
			<br>
			<br>
			-->
		
		</div>
		
		<!--
		-->
	
	</body>
	
	<!--
	-->

</html>
