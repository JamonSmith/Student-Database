<!DOCTYPE html>

<html>

	<head>
	
		<title> Student Information </title>
		
		<link rel="stylesheet" href="style.css">
		
		<script src="student-info.js" defer></script>
	
	</head>
	
	<body>
	
		<a href="students.html">
			
			<button type="button" id="srBackButton"> Home </button>
				
		</a>	
	
		<h1> Student Information </h1>
		
		<p id="studentIDNumber">  </p>
		
		<p id="studentLastName">  </p>
		
		<p id="studentFirstName">  </p>
		
		<h3 id="courseTableTitle"> Transcript </h3>
		
		<table id="courseTable">
		
			<tr>
			
				<th id="courseHeader"> Course </th>
				<th id="gradeHeader"> Grade </th>
			
			</tr>
		
		</table>
		
		<p id="courseCount">  </p>
		
		<p id="studentAverage">  </p> 
		<br>
		<hr>
		
		<label for="courseNameBox"> Course Name </label>
		<br>
		
		<input id="courseNameBox" type="text" placeholder="Enter Course" required>
		<button type="button" id="clearCourseNameBoxButton" class="clear-button"> Clear Name </button>
		<br>
		<br>
		
		<label for="courseGradeBox"> Course Grade </label>
		<br>
		
		<input id="courseGradeBox" type="number" placeholder="Enter Grade" min="0" max="100" step="0.01" required>
		<button type="button" id="clearCourseGradeBoxButton" class="clear-button"> Clear Grade </button>
		
		<p id="courseMessage">  </p>
		<br>
		
		<button type="button" id="addCourseButton" class="course-button"> Add Course </button>
		<br>
		
		<button type="button" id="updateCourseButton" class="course-button"> Update Course </button>
		<br>
		
		<button type="button" id="removeCourseButton" class="course-button"> Remove Course </button>
		<br>
		<hr>
		
		<button type="button" id="removeStudentButton" class="student-button"> Remove This Student </button>
		<br>
	
	</body>

</html>
